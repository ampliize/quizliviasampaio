<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Análise gratuita de perfil · A-Livia-ndo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body data-campo="escuro">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E6CFA6"/>
        <stop offset=".55" stop-color="#B8915F"/>
        <stop offset="1" stop-color="#8E6A3E"/>
      </linearGradient>
    </defs>
    <symbol id="borboleta" viewBox="0 0 100 70">
      <path fill="url(#ouro)" d="M49 30 C46 16 34 6 20 5 C8 4 2 12 4 21 C6 31 20 37 33 35 C40 34 46 32 49 30 Z"/>
      <path fill="url(#ouro)" d="M51 30 C54 16 66 6 80 5 C92 4 98 12 96 21 C94 31 80 37 67 35 C60 34 54 32 51 30 Z"/>
      <path fill="url(#ouro)" opacity=".8" d="M49 33 C44 34 34 40 30 48 C26 55 30 60 38 57 C45 54 49 42 49 33 Z"/>
      <path fill="url(#ouro)" opacity=".8" d="M51 33 C56 34 66 40 70 48 C74 55 70 60 62 57 C55 54 51 42 51 33 Z"/>

    </symbol>
  </svg>

  <header class="topo" id="topo" hidden>
    <button class="voltar" id="voltar" type="button" aria-label="Voltar para a pergunta anterior">←</button>
    <div class="trilha" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progresso"></div>
    <span class="contador" id="contador"></span>
  </header>

  <main id="app" class="app" aria-live="polite">
    <noscript><p class="tela">Ative o JavaScript para fazer o quiz.</p></noscript>
  </main>
</body>
</html>
